<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>{{.AppName}} · {{.SubjectTitle}}</title>
</head>
<body style="margin:0;padding:0;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#18181b;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fafafa;padding:48px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;width:100%;">
          <tr>
            <td style="padding:0 4px 18px;font-size:12px;line-height:1;color:#71717a;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;">
              {{.AppName}}
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:32px 32px 4px;">
                    <h1 style="margin:0;font-size:20px;line-height:1.4;font-weight:600;letter-spacing:-0.011em;color:#09090b;">{{.SubjectTitle}}</h1>
                    <p style="margin:8px 0 0;font-size:14px;line-height:1.65;color:#52525b;">
                      {{.Greeting}}请在 {{.ExpiresMinutes}} 分钟内输入下方验证码完成验证。
                    </p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:24px 32px 4px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f5;border:1px solid #e4e4e7;border-radius:10px;">
                      <tr>
                        <td align="center" style="padding:22px 16px;">
                          <div style="font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;font-size:30px;font-weight:600;letter-spacing:0.42em;color:#09090b;line-height:1;">{{.Code}}</div>
                          <div style="margin:12px 0 0;font-size:12px;color:#71717a;letter-spacing:0.02em;">{{.ExpiresMinutes}} 分钟内有效</div>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:20px 32px 0;font-size:13px;line-height:1.65;color:#71717a;">
                    不是你本人发起的验证？忽略本邮件即可，账号不会受到任何影响。
                  </td>
                </tr>
                <tr>
                  <td style="padding:24px 32px 28px;">
                    <div style="border-top:1px solid #e4e4e7;padding-top:18px;font-size:12px;line-height:1.65;color:#a1a1aa;">
                      系统自动邮件，请勿直接回复。{{if .SupportEmail}}如需协助，发送邮件到 <a href="mailto:{{.SupportEmail}}" style="color:#18181b;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;">{{.SupportEmail}}</a>。{{end}}
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 4px 0;font-size:11px;line-height:1.5;color:#a1a1aa;letter-spacing:0.02em;">
              © {{.Year}} {{.AppName}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
