version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/auth/repo/queries"
    schema: "migrations/auth"
    gen:
      go:
        package: "authdb"
        out: "internal/store/sqlc/auth"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: true
        emit_interface: true
        emit_prepared_queries: false
        json_tags_case_style: "snake"
  - engine: "postgresql"
    queries: "internal/quota/repo/queries"
    schema: "migrations/quota"
    gen:
      go:
        package: "quotadb"
        out: "internal/store/sqlc/quota"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: true
        emit_interface: true
  - engine: "postgresql"
    queries: "internal/billing/repo/queries"
    schema: "migrations/billing"
    gen:
      go:
        package: "billingdb"
        out: "internal/store/sqlc/billing"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: true
        emit_interface: true
  - engine: "postgresql"
    queries: "internal/pool/repo/queries"
    schema: "migrations/pool"
    gen:
      go:
        package: "pooldb"
        out: "internal/store/sqlc/pool"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: true
        emit_interface: true
