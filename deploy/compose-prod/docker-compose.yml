# ============================================================================
# Music Gateway 完整生产编排
#   postgres + pgadmin + redis + gateway + web
#
# 启动:
#   cp .env.example .env  # 改密码 / 端口
#   docker compose up -d --build
#
# 网络拓扑:
#   - 内部 mgw-net 桥接, service name 即 DNS (gateway -> postgres / redis)
#   - 仅 web / gateway / pgadmin / postgres / redis 端口对外暴露 (端口可改 .env)
# ============================================================================

name: music-gateway

services:
  postgres:
    image: postgres:16-alpine
    container_name: mgw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mgw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      POSTGRES_DB: ${POSTGRES_DB:-mgw}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_EXT:-15432}:5432"
    networks:
      - mgw-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mgw} -d ${POSTGRES_DB:-mgw}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:9.14
    container_name: mgw-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD 必填}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_DEFAULT_LANGUAGE: "'zh'"
      PGADMIN_CONFIG_LOGIN_BANNER: '"Music Gateway Console"'
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "30"
      PGADMIN_DISABLE_POSTFIX: "True"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-mgw}
      POSTGRES_DB: ${POSTGRES_DB:-mgw}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-15050}:80"
    networks:
      - mgw-net
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: mgw-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 必填}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT_EXT:-16379}:6379"
    networks:
      - mgw-net
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: ../../gateway
      dockerfile: Dockerfile
    image: mgw/gateway:latest
    container_name: mgw-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ---- 数据存储 ----
      # MGW_GATEWAY_PG 是 url-encoded 的完整 DSN, 优先级最高,
      # 这样密码里有 @ / : / 等特殊字符也不会破坏自动拼接.
      MGW_GATEWAY_PG: ${MGW_GATEWAY_PG}
      DATABASE_URL: ${MGW_GATEWAY_PG}
      POSTGRES_USER: ${POSTGRES_USER:-mgw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mgw}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # ---- 凭据池 KEK ----
      POOL_KEK_HEX: ${POOL_KEK_HEX}
      # ---- 时区 ----
      TZ: ${TZ:-Asia/Shanghai}
      # ---- 管理面 ----
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      MGW_GATEWAY_BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-admin@example.com}
      # ---- 注册控制 ----
      REGISTER_IP_LIMIT: "${REGISTER_IP_LIMIT:-false}"
      # ---- SMTP (空 = LogSender, 验证码进 stdout) ----
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Music Gateway}
      SMTP_TLS: ${SMTP_TLS:-auto}
      # ---- 邮箱验证 + 激活 ----
      EMAIL_VERIFY_REQUIRED: "${EMAIL_VERIFY_REQUIRED:-false}"
      ACTIVATION_REQUIRED: "${ACTIVATION_REQUIRED:-false}"
      ACTIVATION_BASE_URL: ${ACTIVATION_BASE_URL}
      # ---- 监听 ----
      MGW_GATEWAY_HTTP: ":8080"
    ports:
      - "${GATEWAY_PORT_EXT:-18080}:8080"
    networks:
      - mgw-net
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Music Gateway Console}
    image: mgw/web:latest
    container_name: mgw-web
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      # 服务端 (proxy / RSC) 用; 容器内通过 service DNS 走 gateway
      BACKEND_URL: ${BACKEND_URL:-http://gateway:8080}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sid}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-csrf_token}
      CSRF_HEADER_NAME: ${CSRF_HEADER_NAME:-X-CSRF-Token}
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      PROXY_TIMEOUT_MS: "${PROXY_TIMEOUT_MS:-15000}"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Music Gateway Console}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_PORT_EXT:-13000}:3000"
    networks:
      - mgw-net
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  mgw-net:
    name: mgw-net
    driver: bridge

volumes:
  postgres-data:
    name: mgw-postgres-data
  pgadmin-data:
    name: mgw-pgadmin-data
  redis-data:
    name: mgw-redis-data
